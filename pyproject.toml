[project]
name = "brawl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.28.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.2",
    "requests>=2.32.3",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "brawl_stats"
module-root = "pipelines/src"

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
# verify_determinism.py imports gen_artifacts.py as a module.
extraPaths = ["pipelines/scripts"]
strictParameterNoneValue = false
reportOptionalMemberAccess = "warning"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E402", "E501"]
